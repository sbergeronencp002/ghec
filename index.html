<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>GHEC · CSSBF — Maintenance</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#f3f6f9;color:#203657;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{width:min(100%,580px);padding:clamp(30px,6vw,60px);background:#fff;border:1px solid #e0e7ef;border-radius:18px;box-shadow:0 16px 45px rgba(31,52,84,.06);text-align:center}
  .brand{font:700 clamp(25px,4vw,34px) Georgia,serif;letter-spacing:-.03em;color:#203657}
  .line{height:3px;width:64px;border-radius:2px;background:#2b8f91;margin:24px auto}
  h1{font-size:clamp(22px,3.4vw,28px);letter-spacing:-.02em;margin:0 0 16px}
  p{color:#5d6978;line-height:1.65;margin:0;font-size:16px}
  footer{font-size:13px;color:#7c8792;margin-top:32px}
</style>
</head>
<body>
<main>
  <div class="brand">GHEC · CSSBF</div>
  <div class="line" aria-hidden="true"></div>
  <h1>Site temporairement en maintenance</h1>
  <p>Nous effectuons des travaux sur la plateforme de géographie, histoire et éducation à la citoyenneté. Les ressources seront de nouveau accessibles prochainement.</p>
  <footer>Merci de votre compréhension.</footer>
</main>
</body>
</html>
